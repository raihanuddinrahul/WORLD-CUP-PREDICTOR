<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFA World Cup 2026 Predictor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>FIFA WORLD CUP 2026</h1>
            <p class="subtitle">Official Match Predictor & Live Leaderboard</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('predictions')">Predict Matches</button>
            <button class="tab-btn" onclick="switchTab('leaderboard')">Live Leaderboard</button>
        </div>

        <div id="predictions" class="tab-content active-content">
            <div id="auth-form" class="auth-box">
                <h3>Create Account / Login to Predict</h3>
                <input type="text" id="username" placeholder="Your Name">
                <input type="email" id="email" placeholder="Your Email">
                <input type="password" id="password" placeholder="Password">
                <button onclick="registerUser()">Enter Dashboard</button>
            </div>

            <div id="user-profile" class="profile-box" style="display: none;">
                <p>Welcome, <span id="prof-name" class="gold-text"></span>!</p>
                <p>Email: <span id="prof-email"></span></p>
                <p>Your Score: <span id="prof-points" class="gold-text fw-bold">0 Points</span></p>
                <button onclick="logout()" class="btn-logout">Logout</button>
            </div>

            <div class="matches-section id-locked">
                <h2>Group Stage Matches</h2>
                <div id="group-matches-container" class="matches-grid"></div>
                <h2 style="margin-top: 40px;">Knockout Stage</h2>
                <div id="knockout-matches-container" class="matches-grid"></div>
                <div class="submit-area">
                    <button class="btn-submit" onclick="submitPredictions()">Submit All Predictions</button>
                </div>
            </div>
        </div>

        <div id="leaderboard" class="tab-content">
            <h2>Live Leaderboard (Real-time Rankings)</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Player Name</th>
                            <th>Total Points</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
